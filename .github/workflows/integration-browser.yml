name: Integration browser review
on:
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  integration-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.integrations.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-browser-review
          path: |
            integration-browser-report/
            test-results/
          retention-days: 14
